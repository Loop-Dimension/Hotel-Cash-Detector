# Hotel Cash Detector - Docker Compose Configuration
#
# This file defines the microservices architecture:
# - ml-service: FastAPI ML detection service (GPU-enabled)
# - django-backend: Django web application
# - postgres: PostgreSQL database
# - nginx: Reverse proxy
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d --build      # Rebuild and start
#   docker-compose logs -f ml-service # View ML service logs
#   docker-compose down               # Stop all services

services:
  # ==========================================================================
  # ML Detection Service (FastAPI - CPU)
  # ==========================================================================
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: hotel-ml-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - USE_GPU=False
      - MODELS_DIR=/app/models
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount model weights (read-only for security)
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hotel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Django Backend
  # ==========================================================================
  django-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-django
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Django settings
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}

      # ML Service configuration
      - USE_ML_SERVICE=True
      - ML_SERVICE_URL=http://ml-service:8001
      - ML_SERVICE_TIMEOUT=30

      # Database
      - DB_ENGINE=postgresql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-cctv}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}

      # Gemini API
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_VALIDATION_ENABLED=${GEMINI_VALIDATION_ENABLED:-True}

      # S3 Storage (optional)
      - USE_S3=${USE_S3:-False}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-ap-northeast-2}
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      ml-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hotel-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-cctv}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # Nginx Reverse Proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: hotel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./staticfiles:/var/www/static:ro
      - ./media:/var/www/media:ro
    depends_on:
      - django-backend
      - ml-service
    networks:
      - hotel-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # Redis (Optional - for caching/queues)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: unless-stopped
    networks:
      - hotel-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
    driver: local

networks:
  hotel-network:
    driver: bridge
